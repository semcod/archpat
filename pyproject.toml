[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "archpat"
version = "0.1.0"
description = "Pattern-aware architecture graph synthesis from user stories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.10,<3", "networkx>=3.2,<4"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
mcp = ["mcp>=1.20,<2"]
yaml = ["PyYAML>=6,<7"]

[project.scripts]
archpat = "archpat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p wellmanifest_governance"

[tool.wellmanifest]
standard = "0.20.166"
revision = "c9bb73ce5ce861e78c26619e36e5b016fda56e2d"
gate = "project/governance-check.sh"

